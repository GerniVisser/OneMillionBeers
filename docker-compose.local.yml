services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: omb
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do echo waiting for minio; sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/omb-photos;
      /usr/bin/mc anonymous set public local/omb-photos;
      exit 0;
      "

  waha:
    # Keep in step with docker-compose.yml so local dev reproduces production.
    image: devlikeapro/waha:latest-2026.9.2
    network_mode: host
    environment:
      PORT: '3100'
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: local-api-key
      WAHA_NOWEB_WA_VERSION: auto-web
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'
      WAHA_EVENTS_DOWNLOAD_MEDIA: 'true'
      WAHA_EVENTS_DOWNLOAD_MEDIA_MIMETYPES: image
      # The collector fetches the media on every webhook attempt, so it must outlive
      # the retries below. The default lifetime is 180 s.
      WHATSAPP_FILES_LIFETIME: '1800'
      # Every session delivers to the collector, so a number paired in the dashboard
      # needs nothing else. The collector answers 503 when it could not store an
      # event; retries back off from 4 s over ~17 min.
      WHATSAPP_HOOK_URL: http://localhost:8080/webhook
      WHATSAPP_HOOK_EVENTS: message,message.revoked,session.status,group.v2.join
      WHATSAPP_HOOK_RETRIES_POLICY: exponential
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: '2'
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: '8'
      WAHA_PRINT_QR: 'true'
    volumes:
      - waha-sessions:/app/.sessions

volumes:
  postgres-data:
  minio-data:
  waha-sessions:
