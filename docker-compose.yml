services:
  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-gateway:${GIT_SHA}
    build:
      context: ./packages/gateway
      dockerfile: Dockerfile
      target: prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - collector-whatsapp
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/nginx
        tag: nginx/{{.ID}}

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-backend:${GIT_SHA}
    expose:
      - '3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/backend
        tag: backend/{{.ID}}

  waha:
    # Pinned deliberately. WAHA is NOT in the deploy.yml pull/up list, because the
    # container has no volume — recreating it wipes the WhatsApp session and forces
    # a QR re-scan, which needs a human with the phone. Upgrade as a planned action:
    #   docker compose --env-file .env --env-file .env.sha pull waha
    #   docker compose --env-file .env --env-file .env.sha up -d --no-deps waha
    # then re-pair at /whatsapp/status?token=...
    #
    # Keep this current. WhatsApp periodically invalidates the WhatsApp Web version
    # baked into the NOWEB engine, which breaks login with a registration loop
    # (`not logged in, attempting registration...` -> `Connection Failure`) that no
    # amount of restarting fixes — only a newer image does. That took production
    # down for ~46h on 2026-07-28; 2026.7.2 is the release that fixed it.
    image: devlikeapro/waha:latest-2026.7.2
    expose:
      - '3000'
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_START_SESSION: default
      WHATSAPP_DOWNLOAD_MEDIA: 'true'
    logging:
      driver: awslogs
      options:
        awslogs-group: /omb/waha
        awslogs-region: us-east-1
        tag: 'waha/{{.ID}}'

  collector-whatsapp:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-collector-whatsapp:${GIT_SHA}
    expose:
      - '8080'
    restart: unless-stopped
    depends_on:
      - waha
      - backend
    environment:
      BACKEND_URL: http://backend:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_URL: http://collector-whatsapp:8080/webhook
      COLLECTOR_PORT: '8080'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      STATUS_TOKEN: ${STATUS_TOKEN}
      ENABLE_ALERTS: ${ENABLE_ALERTS:-false}
      ALERT_EMAIL: ${ALERT_EMAIL}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      AWS_REGION: ${AWS_REGION}
    logging:
      driver: awslogs
      options:
        awslogs-group: /omb/collector-whatsapp
        awslogs-region: us-east-1
        tag: 'collector-whatsapp/{{.ID}}'

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-frontend:${GIT_SHA}
    expose:
      - '3001'
    environment:
      ORIGIN: ${ORIGIN:-https://onemillionbeers.co.za}
      PORT: '3001'
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/frontend
        tag: frontend/{{.ID}}

volumes:
  certbot-www:
  certbot-certs:
