services:
  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-gateway:${GIT_SHA}
    build:
      context: ./packages/gateway
      dockerfile: Dockerfile
      target: prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - collector-whatsapp
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/nginx
        tag: nginx/{{.ID}}

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-backend:${GIT_SHA}
    expose:
      - '3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/backend
        tag: backend/{{.ID}}

  waha:
    # NEVER RENAME THIS SERVICE. It is in the `up -d` list in deploy.yml but not
    # in the `pull` list, and the deploy runs with --remove-orphans: a rename
    # deletes the running container while the replacement is not started. If a
    # rename is ever unavoidable, add the new service AND its up-list entry in
    # one commit, deploy, confirm both containers exist, then remove the old one.
    #
    # Changes to this block DO apply on deploy (`up -d` is a no-op unless the
    # resolved config changed), but the image is NOT pulled automatically, so a
    # mutable tag can never roll the version forward mid-deploy. Changing the
    # pinned tag below is a deliberate upgrade: snapshot the session volume
    # first, and verify afterwards that every session is WORKING again.
    #
    #   docker run --rm -v onemillionbeers_waha-sessions:/s \
    #     -v /opt/onemillionbeers/backup:/b alpine \
    #     tar czf /b/waha-sessions-$(date +%F).tgz -C /s .
    #
    # The pairing lives in the waha-sessions volume, so recreating the container
    # keeps it. `docker compose down -v` destroys it; nothing in the deploy runs
    # `down` and nothing should.
    #
    # WhatsApp periodically invalidates the WhatsApp Web version baked into the
    # NOWEB engine, which breaks login with a registration loop
    # (`not logged in, attempting registration...` -> `Connection Failure`) that no
    # amount of restarting fixes. That took production down for ~46h on 2026-07-28.
    # WAHA_NOWEB_WA_VERSION=auto-web fetches the current version on start (falls
    # back to the built-in one if the fetch fails or is older) so a stale image no
    # longer strands the session. Do not change it after the QR has been scanned.
    image: devlikeapro/waha:latest-2026.8.2
    expose:
      - '3000'
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_NOWEB_WA_VERSION: auto-web
      # Bring every session back after a container restart or an OOM kill,
      # rather than only the one named in WHATSAPP_START_SESSION. The collector
      # creates and configures the sessions it needs on boot.
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'
      # Only images reach the collector; skip downloading video/audio/documents.
      WAHA_EVENTS_DOWNLOAD_MEDIA: 'true'
      WAHA_EVENTS_DOWNLOAD_MEDIA_MIMETYPES: image
    # Liveness only. /ping is the one unauthenticated endpoint, so the check
    # needs no API key and no shell expansion. Deliberately NOT session health:
    # a check that failed on an unpaired number would mark the container
    # unhealthy while the other numbers are ingesting perfectly well. Session
    # health is the collector's job — see session-monitor.ts.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Capped because an unbounded WAHA leaked until the kernel OOM-killer took the
    # whole t3.small down on 2026-10-06. Restarting it costs nothing; losing the
    # host costs the site.
    mem_limit: 640m
    volumes:
      - waha-sessions:/app/.sessions
    logging:
      driver: awslogs
      options:
        awslogs-group: /omb/waha
        awslogs-region: us-east-1
        tag: 'waha/{{.ID}}'

  collector-whatsapp:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-collector-whatsapp:${GIT_SHA}
    expose:
      - '8080'
    restart: unless-stopped
    depends_on:
      - waha
      - backend
    environment:
      BACKEND_URL: http://backend:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_URL: http://collector-whatsapp:8080/webhook
      COLLECTOR_PORT: '8080'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      STATUS_TOKEN: ${STATUS_TOKEN}
      ENABLE_ALERTS: ${ENABLE_ALERTS:-false}
      ALERT_EMAIL: ${ALERT_EMAIL}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      AWS_REGION: ${AWS_REGION}
    mem_limit: 256m
    logging:
      driver: awslogs
      options:
        awslogs-group: /omb/collector-whatsapp
        awslogs-region: us-east-1
        tag: 'collector-whatsapp/{{.ID}}'

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/omb-frontend:${GIT_SHA}
    expose:
      - '3001'
    environment:
      ORIGIN: ${ORIGIN:-https://onemillionbeers.co.za}
      PORT: '3001'
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /omb/frontend
        tag: frontend/{{.ID}}

volumes:
  certbot-www:
  certbot-certs:
  waha-sessions:
