events {}

http {
  resolver 127.0.0.11 valid=10s;

# Login attempts against /admin. 10 a minute per IP with a burst of 5 is
# generous for a human and hopeless for a password guesser.
limit_req_zone $binary_remote_addr zone=admin:1m rate=10r/m;
limit_req_status 429;

  server {
    listen 80;
    server_name localhost;

    set $backend             backend:3000;
    set $frontend            frontend:3001;
    set $collector_whatsapp  collector-whatsapp:8080;

    # SSE — must come before the general /api/ block
    location = /api/v1/global/stream {
      proxy_pass         http://$backend/v1/global/stream$is_args$args;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        '';
      chunked_transfer_encoding on;
    }

    # Swagger UI — static assets use absolute /docs/ paths (no /api/ prefix)
    location /docs/ {
      # No URI part: a variable proxy_pass passes a URI verbatim rather than
      # substituting the matched prefix, which pinned every asset to /docs/.
      proxy_pass         http://$backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Internal collector-only API. Never reachable from the internet
    location ~* ^/api/v1/internal {
      return 404;
    }

    # Backend API — strip /api prefix
    location /api/ {
      # Strip /api explicitly. `proxy_pass http://$backend/` looks like it does
      # this, but a variable proxy_pass passes the URI verbatim, so every path
      # arrived at the backend as `/`.
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass         http://$backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # The old operator page, kept as a redirect because that link is in old
    # alert emails.
    location = /whatsapp/status {
      return 301 /admin;
    }

    # Operator page for the WhatsApp numbers. The collector behind it has no
    # auth of its own, so this block is the only thing protecting it. Dev is
    # plain HTTP, so the password crosses the wire in the clear — fine for
    # exercising the config locally, and the reason production is TLS only.
    location ~ ^/admin(/|$) {
      auth_basic           "OneMillionBeers admin";
      auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
      limit_req            zone=admin burst=5 nodelay;

      # No URI part: a variable proxy_pass passes the request URI, query string
      # included, verbatim. Same reason as the /docs/ block.
      proxy_pass         http://$collector_whatsapp;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SvelteKit frontend — hot reload websocket support
    location / {
      proxy_pass         http://$frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        'upgrade';
    }
  }
}
