events {}

http {
  resolver 127.0.0.11 valid=10s;

  # Admin login attempts per client IP: 10 a minute, bursts of 5.
  limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

  server {
    listen 80;
    server_name localhost;

    set $backend             backend:3000;
    set $frontend            frontend:3001;
    set $collector_whatsapp  collector-whatsapp:8080;

    # SSE — must come before the general /api/ block
    location = /api/v1/global/stream {
      proxy_pass         http://$backend/v1/global/stream$is_args$args;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        '';
      chunked_transfer_encoding on;
    }

    # Swagger UI — static assets use absolute /docs/ paths (no /api/ prefix)
    location /docs/ {
      # No URI part: a variable proxy_pass passes a URI verbatim rather than
      # substituting the matched prefix, which pinned every asset to /docs/.
      proxy_pass         http://$backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Internal collector-only API. Never reachable from the internet
    location ~* ^/api/v1/internal {
      return 404;
    }

    # Backend API — strip /api prefix
    location /api/ {
      # Strip /api explicitly. `proxy_pass http://$backend/` looks like it does
      # this, but a variable proxy_pass passes the URI verbatim, so every path
      # arrived at the backend as `/`.
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass         http://$backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Old alert-email link: the token page was replaced by the admin page.
    location = /whatsapp/status {
      # Relative, so it keeps whatever host and port the browser used.
      absolute_redirect off;
      return 301 /admin;
    }

    # Admin login, rate-limited per client IP on top of the collector's own
    # lockout after 5 failed attempts.
    location = /admin/api/login {
      limit_req          zone=admin_login burst=5 nodelay;
      limit_req_status   429;
      proxy_pass         http://$collector_whatsapp;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      # Overwritten, never passed through: the collector keys login lockouts on it.
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # WhatsApp admin page and its API (login required), served by the collector.
    # No URI part in proxy_pass, so the request URI and query string pass through
    # unchanged (a URI part with a variable upstream drops the query; see 1b6ceb7).
    location = /admin {
      proxy_pass         http://$collector_whatsapp;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      # Overwritten, never passed through: the collector keys login lockouts on it.
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /admin/ {
      proxy_pass         http://$collector_whatsapp;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      # Overwritten, never passed through: the collector keys login lockouts on it.
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SvelteKit frontend — hot reload websocket support
    location / {
      proxy_pass         http://$frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        'upgrade';
    }
  }
}
