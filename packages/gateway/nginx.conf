events {}

http {

# Docker's embedded DNS, re-checked every 10s. Static `upstream` blocks resolve
# their names once at startup and cache the IPs for the life of the process, so a
# container that restarts onto a different IP strands the gateway on a dead
# address and every request 502s until nginx is restarted by hand. That took the
# site down on 2026-10-14, when backend and frontend restarted and swapped IPs.
resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=admin:1m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  # Let's Encrypt HTTP-01 challenge — must be served over plain HTTP before redirect
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name onemillionbeers.co.za;

  ssl_certificate     /etc/letsencrypt/live/onemillionbeers.co.za/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/onemillionbeers.co.za/privkey.pem;

  set $backend             backend:3000;
  set $frontend            frontend:3001;
  set $collector_whatsapp  collector-whatsapp:8080;

  # SSE — must come before the general /api/ block
  location = /api/v1/global/stream {
    proxy_pass         http://$backend/v1/global/stream$is_args$args;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Required for SSE
    proxy_set_header   Connection        '';
    chunked_transfer_encoding on;
  }

  # Internal collector-only API. Never reachable from the internet
  location ~* ^/api/v1/internal {
    return 404;
  }

  # Backend API — strip /api prefix
  location /api/ {
    # Strip /api explicitly. With a variable in proxy_pass, a URI part is passed
    # through verbatim rather than replacing the matched prefix, so the old
    # `proxy_pass http://backend/` form would send every path as `/`.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         http://$backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Old alert emails link here.
  location = /whatsapp/status {
    return 301 https://$host/admin;
  }

  # The only protection /admin has: the collector behind it does no auth.
  # An unset ADMIN_HTPASSWD leaves an unusable password file, so it fails closed.
  location ~ ^/admin(/|$) {
    auth_basic           "OneMillionBeers admin";
    auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
    limit_req            zone=admin burst=5 nodelay;

    # No URI part, so the request URI and query string pass through unchanged.
    proxy_pass         http://$collector_whatsapp;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SvelteKit frontend — everything else
  location / {
    proxy_pass         http://$frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        'upgrade';
  }
}

server {
  listen 443 ssl;
  server_name www.onemillionbeers.co.za;

  ssl_certificate     /etc/letsencrypt/live/onemillionbeers.co.za/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/onemillionbeers.co.za/privkey.pem;

  return 301 https://onemillionbeers.co.za$request_uri;
}

} # http
